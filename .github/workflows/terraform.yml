name: Terraform

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

jobs:
  terraform:
    runs-on: ubuntu-latest
    # NEO-299: no timeout existed before; a stuck plan/apply or a hanging
    # curl (now bounded to 20s per attempt by --max-time, but retried) should
    # still not be able to wedge the runner indefinitely.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set environment
        run: |
          REF="${{ github.event_name == 'pull_request' && github.base_ref || github.ref_name }}"
          if [ "$REF" = "main" ]; then
            echo "ENV_NAME=prod" >> $GITHUB_ENV
            echo "GCP_PROJECT=neonbinder" >> $GITHUB_ENV
            echo "TF_VAR_FILE=environments/prod.tfvars" >> $GITHUB_ENV
            echo "STATE_PREFIX=terraform/state/prod" >> $GITHUB_ENV
            echo "WIF_PROVIDER=projects/117170654588/locations/global/workloadIdentityPools/github-actions/providers/github-terraform" >> $GITHUB_ENV
            echo "TF_SERVICE_ACCOUNT=neonbinder-tf-deployer@neonbinder.iam.gserviceaccount.com" >> $GITHUB_ENV
          else
            echo "ENV_NAME=dev" >> $GITHUB_ENV
            echo "GCP_PROJECT=neonbinder-dev" >> $GITHUB_ENV
            echo "TF_VAR_FILE=environments/dev.tfvars" >> $GITHUB_ENV
            echo "STATE_PREFIX=terraform/state/dev" >> $GITHUB_ENV
            echo "WIF_PROVIDER=projects/339836466983/locations/global/workloadIdentityPools/github-actions/providers/github-terraform" >> $GITHUB_ENV
            echo "TF_SERVICE_ACCOUNT=neonbinder-tf-deployer@neonbinder-dev.iam.gserviceaccount.com" >> $GITHUB_ENV
          fi

      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ env.WIF_PROVIDER }}
          service_account: ${{ env.TF_SERVICE_ACCOUNT }}

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "~> 1.0"

      - name: Terraform Init
        run: terraform init -backend-config="prefix=${{ env.STATE_PREFIX }}"

      - name: Terraform Validate
        run: terraform validate

      # NEO-299: the single source of truth for heavy/fast preprocess
      # capacity is the monorepo's apps/web/convex/preprocessCapacity.json
      # (public repo, fetched unauthenticated). This fails plan AND apply on
      # a real mismatch between that file and this env's tfvars, so the three
      # numbers (terraform, the live Cloud Run service, Convex) can never
      # silently drift apart again.
      #
      # Order: this env's tfvars is read FIRST, before the JSON is even
      # fetched, so a fetch failure never masks a tfvars problem and every
      # error message can always name the tfvars value it found.
      #
      # 404 tolerance is environment-specific. In dev/develop, a 404 is a
      # warning, not a failure: this terraform PR's own `develop` merge
      # (which applies to dev on push) can land BEFORE the companion
      # monorepo PR that adds preprocessCapacity.json merges to its main, and
      # a hard failure there would deadlock that ordering. In prod, a 404 is
      # always a real fault and FAILS the run: the rollout order guarantees
      # the monorepo merge (and therefore the JSON's existence) lands before
      # any prod apply, so a missing file at that point means something
      # broke, not that a merge hasn't happened yet.
      - name: Preprocess capacity parity check
        run: |
          set -euo pipefail

          ACTUAL_HEAVY=$(grep -E '^heavy_preprocess_max_instances[[:space:]]*=' "${TF_VAR_FILE}" | grep -oE '[0-9]+' | head -1)
          ACTUAL_FAST=$(grep -E '^preprocess_max_instances[[:space:]]*=' "${TF_VAR_FILE}" | grep -oE '[0-9]+' | head -1)
          echo "${TF_VAR_FILE}: heavy_preprocess_max_instances=$ACTUAL_HEAVY preprocess_max_instances=$ACTUAL_FAST"

          URL="https://raw.githubusercontent.com/neonbinder/neonbinder/main/apps/web/convex/preprocessCapacity.json"
          HTTP_CODE=$(curl -sS --retry 3 --retry-all-errors --max-time 20 -o capacity.json -w "%{http_code}" "$URL")

          if [ "$HTTP_CODE" = "404" ]; then
            if [ "$ENV_NAME" = "prod" ]; then
              echo "::error::preprocessCapacity.json not found on neonbinder/neonbinder@main (404) while planning/applying PROD. Prod's rollout order requires the monorepo file to exist before any prod apply, so a 404 here is a real fault, not a pending merge."
              exit 1
            fi
            echo "::warning::preprocessCapacity.json not found on neonbinder/neonbinder@main (404) — skipping the heavy/fast capacity parity check for ${ENV_NAME}. Expected only until the companion NEO-299 monorepo PR merges; if this warning persists past that, something is wrong."
            exit 0
          fi
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::Unexpected HTTP $HTTP_CODE fetching $URL"
            exit 1
          fi

          EXPECTED_HEAVY=$(jq -r ".heavy.${ENV_NAME}" capacity.json)
          EXPECTED_FAST=$(jq -r ".fast.${ENV_NAME}" capacity.json)

          if [ "$EXPECTED_HEAVY" = "null" ] || [ "$EXPECTED_FAST" = "null" ]; then
            echo "::error::preprocessCapacity.json has no heavy.${ENV_NAME} or fast.${ENV_NAME} entry"
            exit 1
          fi

          FAIL=0
          if [ "$ACTUAL_HEAVY" != "$EXPECTED_HEAVY" ]; then
            echo "::error::${TF_VAR_FILE} heavy_preprocess_max_instances=$ACTUAL_HEAVY but preprocessCapacity.json heavy.${ENV_NAME}=$EXPECTED_HEAVY"
            FAIL=1
          fi
          if [ "$ACTUAL_FAST" != "$EXPECTED_FAST" ]; then
            echo "::error::${TF_VAR_FILE} preprocess_max_instances=$ACTUAL_FAST but preprocessCapacity.json fast.${ENV_NAME}=$EXPECTED_FAST"
            FAIL=1
          fi
          if [ "$FAIL" = "1" ]; then
            exit 1
          fi
          echo "Parity OK for ${ENV_NAME}: heavy=$ACTUAL_HEAVY fast=$ACTUAL_FAST"
        env:
          ENV_NAME: ${{ env.ENV_NAME }}
          TF_VAR_FILE: ${{ env.TF_VAR_FILE }}

      - name: Terraform Plan
        id: plan
        run: terraform plan -var-file="${{ env.TF_VAR_FILE }}" -no-color -out=tfplan 2>&1 | tee tfplan.txt
        continue-on-error: true

      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('tfplan.txt', 'utf8').substring(0, 60000);
            const body = `#### Terraform Plan (${{ env.ENV_NAME }}) \`${{ steps.plan.outcome }}\`

            <details><summary>Show Plan</summary>

            \`\`\`
            ${plan}
            \`\`\`

            </details>

            *Pushed by: @${{ github.actor }}, Action: \`${{ github.event_name }}\`*`;

            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: body
            });

      - name: Fail on plan error
        if: steps.plan.outcome == 'failure'
        run: exit 1

      - name: Terraform Apply
        if: github.event_name == 'push' && (github.ref_name == 'main' || github.ref_name == 'develop')
        run: terraform apply -auto-approve tfplan
